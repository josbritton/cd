# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ./resources/upstream.yaml
- ./resources/argocd-metrics-servicemonitor.yaml
- ./resources/argocd-server-metrics-servicemonitor.yaml
- ./resources/argocd-repo-server-metrics-servicemonitor.yaml
- ./resources/argocd-notifications-controller-metrics-servicemonitor.yaml
- ./resources/cert.yaml
- ./resources/httpproxy.yaml
- ./resources/delegation.yaml
- ./resources/stork-agent-service-bind.yaml
- ./resources/stork-agent-endpoints-bind.yaml
- ./resources/stork-agent-servicemonitor-bind.yaml
- ./resources/prometheusrule.yaml
- ./resources/prometheus-cert.yaml
- ./resources/prometheus-httpproxy.yaml
- ./resources/ceph-rules.yaml
# yamllint disable-line rule:comments
- github.com/dotdc/grafana-dashboards-kubernetes?ref=a5ce3d43e0c970f464cada289ec1a691426c7eaf # tag=v3.0.6
configMapGenerator:
- name: argocd-dashboard-cm
  files: [files/argocd-dashboard.json]
  options:
    disableNameSuffixHash: true
    labels:
      grafana_dashboard: "1"
- name: proxmox-dashboard-cm
  files: [files/proxmox-cluster-dashboard.json]
  options:
    disableNameSuffixHash: true
    labels:
      grafana_dashboard: "1"
- name: bind9-resolver-dashboard-cm
  files: [files/bind9-resolver.json]
  options:
    disableNameSuffixHash: true
    labels:
      grafana_dashboard: "1"
- name: overview-dashboard-cm
  files: [files/overview-dashboard.json]
  options:
    disableNameSuffixHash: true
    labels:
      grafana_dashboard: "1"
- name: airgradient-dashboard-cm
  files: [files/airgradient-dashboard.json]
  options:
    disableNameSuffixHash: true
    labels:
      grafana_dashboard: "1"
- name: ceph-cluster-dashboard-cm
  files:
  # - ceph-application-overview.json=https://raw.githubusercontent.com/ceph/ceph/refs/tags/v20.2.1/monitoring/ceph-mixin/dashboards_out/ceph-application-overview.json
  # - ceph-cluster-advanced.json=https://raw.githubusercontent.com/ceph/ceph/refs/tags/v20.2.1/monitoring/ceph-mixin/dashboards_out/ceph-cluster-advanced.json
  - ceph-cluster.json=https://raw.githubusercontent.com/ceph/ceph/refs/tags/v20.2.1/monitoring/ceph-mixin/dashboards_out/ceph-cluster.json
  # - ceph-nvmeof-performance.json=https://raw.githubusercontent.com/ceph/ceph/refs/tags/v20.2.1/monitoring/ceph-mixin/dashboards_out/ceph-nvmeof-performance.json
  # - ceph-nvmeof.json=https://raw.githubusercontent.com/ceph/ceph/refs/tags/v20.2.1/monitoring/ceph-mixin/dashboards_out/ceph-nvmeof.json
  # - cephfs-subvolume.json=https://raw.githubusercontent.com/ceph/ceph/refs/tags/v20.2.1/monitoring/ceph-mixin/dashboards_out/cephfs-subvolume.json
  # - cephfsdashboard.json=https://raw.githubusercontent.com/ceph/ceph/refs/tags/v20.2.1/monitoring/ceph-mixin/dashboards_out/cephfsdashboard.json
  - host-details.json=https://raw.githubusercontent.com/ceph/ceph/refs/tags/v20.2.1/monitoring/ceph-mixin/dashboards_out/host-details.json
  - hosts-overview.json=https://raw.githubusercontent.com/ceph/ceph/refs/tags/v20.2.1/monitoring/ceph-mixin/dashboards_out/hosts-overview.json
  # - multi-cluster-overview.json=https://raw.githubusercontent.com/ceph/ceph/refs/tags/v20.2.1/monitoring/ceph-mixin/dashboards_out/multi-cluster-overview.json
  # - node-exporter.json=https://raw.githubusercontent.com/ceph/ceph/refs/tags/v20.2.1/monitoring/ceph-mixin/dashboards_out/node-exporter.json
  - osd-device-details.json=https://raw.githubusercontent.com/ceph/ceph/refs/tags/v20.2.1/monitoring/ceph-mixin/dashboards_out/osd-device-details.json
  - osds-overview.json=https://raw.githubusercontent.com/ceph/ceph/refs/tags/v20.2.1/monitoring/ceph-mixin/dashboards_out/osds-overview.json
  - pool-detail.json=https://raw.githubusercontent.com/ceph/ceph/refs/tags/v20.2.1/monitoring/ceph-mixin/dashboards_out/pool-detail.json
  - pool-overview.json=https://raw.githubusercontent.com/ceph/ceph/refs/tags/v20.2.1/monitoring/ceph-mixin/dashboards_out/pool-overview.json
  # - radosgw-detail.json=https://raw.githubusercontent.com/ceph/ceph/refs/tags/v20.2.1/monitoring/ceph-mixin/dashboards_out/radosgw-detail.json
  # - radosgw-overview.json=https://raw.githubusercontent.com/ceph/ceph/refs/tags/v20.2.1/monitoring/ceph-mixin/dashboards_out/radosgw-overview.json
  # - radosgw-sync-overview.json=https://raw.githubusercontent.com/ceph/ceph/refs/tags/v20.2.1/monitoring/ceph-mixin/dashboards_out/radosgw-sync-overview.json
  - rbd-details.json=https://raw.githubusercontent.com/ceph/ceph/refs/tags/v20.2.1/monitoring/ceph-mixin/dashboards_out/rbd-details.json
  - rbd-overview.json=https://raw.githubusercontent.com/ceph/ceph/refs/tags/v20.2.1/monitoring/ceph-mixin/dashboards_out/rbd-overview.json
  # - rgw-s3-analytics.json=https://raw.githubusercontent.com/ceph/ceph/refs/tags/v20.2.1/monitoring/ceph-mixin/dashboards_out/rgw-s3-analytics.json
  # - smb-overview.json=https://raw.githubusercontent.com/ceph/ceph/refs/tags/v20.2.1/monitoring/ceph-mixin/dashboards_out/smb-overview.json
  options:
    disableNameSuffixHash: true
    labels:
      grafana_dashboard: "1"
    annotations:
      grafana_folder: Ceph
      argocd.argoproj.io/sync-options: ServerSideApply=true
patches:
- path: overlays/prometheus-crds-annotations.yaml
  target:
    group: apiextensions.k8s.io
    kind: CustomResourceDefinition
    name: .*
    version: v1
- path: overlays/prometheus-operator-grafana-cm.yaml
- target:
    name: .*
    version: v1
    kind: ConfigMap
    labelSelector: app.kubernetes.io/part-of=kube-prometheus-stack,grafana_dashboard=1
  patch: |-
    - op: add
      path: /metadata/annotations/grafana_folder
      value: Cluster
- target:
    name: dashboards\-k8s\-.*
    version: v1
    kind: ConfigMap
    labelSelector: grafana_dashboard=1
  patch: |-
    - op: replace
      path: /metadata/annotations/grafana_folder
      value: Cluster
- target:
    name: argocd-dashboard-cm
    version: v1
    kind: ConfigMap
    labelSelector: grafana_dashboard=1
  patch: |-
    - op: replace
      path: /metadata/annotations/grafana_folder
      value: Cluster
# delete trivy dashboard
- path: overlays/dashboards-k8s-addons-trivy-operator-cm.yaml
# delete macos node exporter dashboard
- path: overlays/prometheus-operator-kube-p-nodes-darwin-cm.yaml
- target:
    kind: CustomResourceDefinition
  patch: |-
    - op: add
      path: /metadata/annotations/argocd.argoproj.io~1sync-wave
      value: "-90"
