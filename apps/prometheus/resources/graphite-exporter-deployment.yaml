# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/refs/heads/master/master/deployment-apps-v1.json
apiVersion: apps/v1
kind: Deployment
metadata:
  name: graphite-exporter
  namespace: prometheus-operator
  labels:
    app.kubernetes.io/name: graphite-exporter
    app.kubernetes.io/instance: graphite-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: graphite-exporter
      app.kubernetes.io/instance: graphite-exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: graphite-exporter
        app.kubernetes.io/instance: graphite-exporter
    spec:
      volumes:
      - name: graphite-mapping
        configMap:
          name: graphite-mapping-cm
      containers:
      - name: graphite-exporter
        image: prom/graphite-exporter:latest@sha256:c1a266f63a84fd11048ab6ad1552a4c497b14522d02823925247698e41eeac2b
        args: [--graphite.mapping-config=/tmp/graphite/graphite_mapping.conf]
        volumeMounts:
        - mountPath: /tmp/graphite
          name: graphite-mapping
        ports:
        - name: graphite
          containerPort: 30910
          protocol: TCP
        - name: graphite-udp
          containerPort: 30910
          protocol: UDP
        - name: metrics
          containerPort: 9108
          protocol: TCP
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            memory: 128Mi
