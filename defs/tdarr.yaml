# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/refs/heads/main/argoproj.io/application_v1alpha1.json
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tdarr
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  destination:
    namespace: tdarr
    server: https://kubernetes.default.svc
  project: default
  sources:
  - path: &path apps/tdarr
    repoURL: https://github.com/josbritton/cd.git
  - path: *path
    repoURL: https://git.swifthomelab.net/josbritton/cd.git
  syncPolicy:
    syncOptions:
    - CreateNamespace=true
