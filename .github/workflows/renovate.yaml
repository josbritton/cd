# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
# yamllint disable rule:comments
name: Renovate
run-name: "Renovate: check for package updates"
on: # yamllint disable-line rule:truthy
  workflow_call: {}
  workflow_dispatch:
    inputs:
      dryRun:
        description: Dry Run
        default: "false"
        required: false
      logLevel:
        description: Log Level
        default: debug
        required: false
  schedule:
  - cron: 0,30 * * * *  # every 30 minutes
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

env:
  LOG_LEVEL: ${{ inputs.logLevel || 'debug' }}
  RENOVATE_AUTODISCOVER: true
  RENOVATE_AUTODISCOVER_FILTER: ${{ github.repository }}
  RENOVATE_DRY_RUN: ${{ inputs.dryRun == true }}
  RENOVATE_PLATFORM: github
  RENOVATE_PLATFORM_COMMIT: true
  RENOVATE_ALLOWED_POST_UPGRADE_COMMANDS: ^make build$
  RENOVATE_VERSION: 43.263.7 # renovate: datasource=docker depName=ghcr.io/renovatebot/renovate

jobs:
  renovate:
    name: Renovate
    runs-on: ubuntu-latest
    steps:
    - name: Generate Token
      uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
      id: app-token
      with:
        client-id: ${{ secrets.BOT_APP_CLIENT_ID }}
        private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}

    - name: Checkout
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      with:
        token: ${{ steps.app-token.outputs.token }}

    - name: Renovate
      uses: renovatebot/github-action@b50d2ba2bd928235abdcc14d06dfafc217f1c565 # v46.1.18
      with:
        docker-cmd-file: .github/renovate/entrypoint
        docker-user: root
        configurationFile: .github/renovate.json5
        token: ${{ steps.app-token.outputs.token }}
        renovate-version: ${{ env.RENOVATE_VERSION }}
