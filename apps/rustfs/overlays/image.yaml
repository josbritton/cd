    spec:
      containers:
      - name: rustfs
        image: rustfs/rustfs:latest@sha256:69bd3c4d8d79b74723bfd68c9fbd9085155d4d4b44a5a136d87502f3075cc68c
      initContainers:
      - name: init-step
        image: busybox:stable@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662
