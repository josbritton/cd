# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/refs/heads/master/master/deployment-apps-v1.json
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cypht
  namespace: cypht
  labels:
    app.kubernetes.io/name: cypht
    app.kubernetes.io/instance: cypht
    app.kubernetes.io/part-of: cypht
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: cypht
      app.kubernetes.io/instance: cypht
      app.kubernetes.io/part-of: cypht
  # sessions and user settings live in postgres, but compose attachments are
  # staged on the local filesystem of whichever replica received the upload
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cypht
        app.kubernetes.io/instance: cypht
        app.kubernetes.io/part-of: cypht
    spec:
      enableServiceLinks: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - topologyKey: kubernetes.io/hostname
            namespaces: []
            namespaceSelector: {}
            labelSelector:
              matchLabels:
                app.kubernetes.io/name: cypht
                app.kubernetes.io/instance: cypht
                app.kubernetes.io/part-of: cypht
            matchLabelKeys:
            - pod-template-hash
      containers:
      - name: cypht
        image: docker.io/cypht/cypht:2.12.2@sha256:e0aecfafa2b1a9ed42603bb6ee33c2f34fb39c48dc39dc3e3986f6dca7623180
        # the entrypoint runs as root (chowns data dirs, generates the site
        # config) then supervisord starts nginx and php-fpm, which drop to
        # www-data; root filesystem must stay writable for the generated config
        securityContext:
          allowPrivilegeEscalation: false
          privileged: false
          capabilities:
            drop: [ALL]
            add: [CHOWN, DAC_OVERRIDE, FOWNER, KILL, NET_BIND_SERVICE, SETGID, SETUID]
        resources:
          requests:
            cpu: 10m
            memory: 128Mi
          limits:
            memory: 512Mi
        ports:
        - name: http
          containerPort: 80
          protocol: TCP
        env:
        - name: DEFAULT_SETTING_TIMEZONE
          value: America/Vancouver
        - name: AUTH_TYPE
          value: DB
        - name: SESSION_TYPE
          value: DB
        - name: USER_CONFIG_TYPE
          value: DB
        # initial account, created on startup if missing (never updated)
        - name: AUTH_USERNAME
          valueFrom:
            secretKeyRef:
              name: cypht-admin
              key: user
              optional: false
        - name: AUTH_PASSWORD
          valueFrom:
            secretKeyRef:
              name: cypht-admin
              key: passwd
              optional: false
        - name: ADMIN_USERS
          valueFrom:
            secretKeyRef:
              name: cypht-admin
              key: user
              optional: false
        - name: GMAIL_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: cypht-gmail
              key: client-id
              optional: true
        - name: GMAIL_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: cypht-gmail
              key: client-secret
              optional: true
        - name: DB_CONNECTION_TYPE
          value: host
        - name: DB_DRIVER
          value: pgsql
        - name: DB_HOST
          value: postgres-lb.cloudnative-pg.svc.cluster.local
        - name: DB_PORT
          value: "5432"
        - name: DB_NAME
          value: cypht
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: cypht-db
              key: user
              optional: false
        - name: DB_PASS
          valueFrom:
            secretKeyRef:
              name: cypht-db
              key: passwd
              optional: false
        # image defaults enable both, pointing at 127.0.0.1
        - name: ENABLE_REDIS
          value: "false"
        - name: ENABLE_MEMCACHED
          value: "false"
        # requests arrive from any envoy pod of the daemonset, so the peer
        # address is not stable for the lifetime of a session
        - name: DISABLE_IP_CHECK
          value: "true"
        volumeMounts:
        - name: attachments
          mountPath: /var/lib/hm3/attachments
        - name: nginx-conf
          mountPath: /etc/nginx/nginx.conf
          subPath: nginx.conf
          readOnly: true
        livenessProbe: &probe
          httpGet:
            port: 80
            path: /
        readinessProbe: *probe
        startupProbe:
          httpGet:
            port: 80
            path: /
          failureThreshold: 30  # waits on postgres, migrations and asset bundling
      volumes:
      - name: attachments
        emptyDir: {}
      - name: nginx-conf
        configMap:
          name: cypht-nginx-conf
