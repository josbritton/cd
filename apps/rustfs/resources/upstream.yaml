# Source: rustfs/charts/rustfs/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rustfs
  namespace: rustfs
  labels:
    helm.sh/chart: rustfs-0.0.86
    app.kubernetes.io/name: rustfs
    app.kubernetes.io/instance: rustfs
    app.kubernetes.io/version: "1.0.0-alpha.86"
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 1
  strategy:
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: rustfs
      app.kubernetes.io/instance: rustfs
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rustfs
        app.kubernetes.io/instance: rustfs
    spec:
      imagePullSecrets:
        []
      affinity:
      securityContext:
        fsGroup: 10001
        runAsGroup: 10001
        runAsUser: 10001
      initContainers:
        - name: init-step
          image: "busybox:stable"
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
          command:
            - sh
            - -c
            - |
              mkdir -p /data /mnt/rustfs/logs
              chmod 755 /mnt/rustfs/logs
          volumeMounts:
            - name: data
              mountPath: /data
            - name: logs
              mountPath: /mnt/rustfs
      containers:
        - name: rustfs
          image: "rustfs/rustfs:1.0.0-alpha.86"
          command: ["/usr/bin/rustfs"]
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
          ports:
            - name: endpoint
              containerPort: 9000
            - name: console
              containerPort: 9001
          envFrom:
            - configMapRef:
                name: rustfs-config
            - secretRef:
                name: rustfs-secret
          resources:
            {}
          livenessProbe:
            failureThreshold: 3
            httpGet:
              path: /health
              port: endpoint
            initialDelaySeconds: 10
            periodSeconds: 5
            successThreshold: 1
            timeoutSeconds: 3
          readinessProbe:
            failureThreshold: 3
            httpGet:
              path: /health/ready
              port: endpoint
            initialDelaySeconds: 30
            periodSeconds: 5
            successThreshold: 1
            timeoutSeconds: 3
          volumeMounts:
            - name: logs
              mountPath: /logs
              subPath: logs
            - name: data
              mountPath: /data
      volumes:
        - name: logs
          persistentVolumeClaim:
            claimName: rustfs-logs
        - name: data
          persistentVolumeClaim:
            claimName: rustfs-data
---
# Source: rustfs/charts/rustfs/templates/tests/test-connection.yaml
apiVersion: v1
kind: Pod
metadata:
  name: "rustfs-test-connection"
  namespace: rustfs
  labels:
    helm.sh/chart: rustfs-0.0.86
    app.kubernetes.io/name: rustfs
    app.kubernetes.io/instance: rustfs
    app.kubernetes.io/version: "1.0.0-alpha.86"
    app.kubernetes.io/managed-by: Helm
  annotations:
    "helm.sh/hook": test
spec:
  containers:
    - name: wget
      image: "busybox:stable"
      imagePullPolicy: IfNotPresent
      command: ['wget']
      args: ['-O', '/dev/null', 'rustfs-svc:9000/health']
  restartPolicy: Never
