LogLevel = "INFO"
ArtistArtPriority = "artist.*, folder.*, album/artist.*, external"  # compatibility with Jellyfin convention
AutoImportPlaylists = false
ImageCacheSize = "0"
EnableArtworkPrecache = false
# TranscodingCacheSize = "100MB"
CacheFolder = "/cache"
CoverArtPriority = "cover.*"  # strict
DiscArtPriority = "disc.*"
SessionTimeout = "6552h" # 9 months
UISearchDebounceMs = 300
DevArtworkMaxRequests = 4 # should not exceed the number of cpu cores on host hardware
MaxImageUploadSize = "150MB"
# EnableWebPEncoding = true
EnforceNonRootUser = true

[Matcher]
PreferStarred = true

[Backup]
Path = "/backup"
Count = 7
Schedule =  "0 0 * * *"  # daily at midnight

[Prometheus]
Enabled = true
MetricsPath = "/metrics"

[Scanner]
Enabled = true
Schedule = "0 * * * *"
ScanOnStartup = false
PurgeMissing = "always"

[Subsonic]
ArtistParticipations = true
