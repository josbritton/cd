# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: reloader
resources:
# yamllint disable-line rule:comments
- github.com/stakater/Reloader/deployments/kubernetes?ref=701e7158b7908bde06fbce8f580b8db30a26eabc # tag=v1.4.24
patches:
- target:
    group: apps
    version: v1
    kind: Deployment
  patch: |-
    - op: replace
      path: /spec/template/spec/containers/0/resources
      value:
        limits:
          memory: 512Mi
        requests:
          cpu: 10m
          memory: 128Mi
- path: ./overlays/image.yaml
