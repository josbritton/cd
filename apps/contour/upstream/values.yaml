contour:
  configInline:
    serverHeaderTransformation: pass_through  # do not add envoy server header to requests
  envoy:
    service:
      type: NodePort
      nodePorts:
        http: 30080
        https: 30443
    resources:
      requests:
        cpu: 10m
        ephemeral-storage: 50Mi
        memory: 1Gi
      limits:
        ephemeral-storage: 2Gi
        memory: 2500Mi
    shutdownManager:
      resources:
        limits:
          ephemeral-storage: 2Gi
          memory: 768Mi
        requests:
          cpu: 500m
          ephemeral-storage: 50Mi
          memory: 512Mi
  contour:
    resources:
      requests:
        cpu: 10m
        ephemeral-storage: 50Mi
        memory: 90Mi
      limits:
        ephemeral-storage: 2Gi
        memory: 180Mi
  defaultBackend:
    enabled: false
