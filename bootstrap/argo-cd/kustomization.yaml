# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../install  # argo-cd will own itself
- ./resources/cert.yaml
- ./resources/httpproxy.yaml
- ./resources/delegation.yaml
configMapGenerator:
- name: argocd-cm
  behavior: merge
  literals:
  - timeout.reconciliation=15s
- name: argocd-cmd-params-cm
  behavior: merge
  literals:
  - server.insecure=true  # proxy HTTP through HTTPs ingress
patches:
- target:
    kind: Secret
    name: argocd-initial-admin-secret
  patch: |
    $patch: delete
    apiVersion: v1
    kind: Secret
    metadata:
      name: argocd-initial-admin-secret
- target:
    kind: Secret
    name: argocd-secret
  patch: |
    $patch: delete
    apiVersion: v1
    kind: Secret
    metadata:
      name: argocd-secret
# below is not applicable to non-HA installs
- target:
    kind: Deployment
    group: apps
    version: v1
    name: argocd-redis-ha-haproxy
    namespace: argocd
  # Due to anti-affinity in deployment, we must set maxSurge to 0 to force the scheduler to
  # remove existing pods before creating new ones to avoid deadlock.
  patch: |-
    - op: replace
      path: /spec/strategy
      value:
        type: RollingUpdate
        rollingUpdate:
          maxSurge: 0
          maxUnavailable: 1
- target:
    kind: ConfigMap
    name: argocd-cm
  patch: |
    apiVersion: v1
    kind: ConfigMap
    metadata:
      name: argocd-cm
    data:
      resource.customizations.health.argoproj.io_Application: |
        hs = {}
        hs.status = "Progressing"
        hs.message = ""
        if obj.status ~= nil then
          if obj.status.health ~= nil then
            hs.status = obj.status.health.status
            if obj.status.health.message ~= nil then
              hs.message = obj.status.health.message
            end
          end
        end
        return hs
      resource.exclusions: |
        # ### Network resources created by the Kubernetes control plane and excluded to reduce the number of watched events and UI clutter
        # - apiGroups:
        #   - ''
        #   - discovery.k8s.io
        #   kinds:
        #   - Endpoints
        #   - EndpointSlice
        ### Internal Kubernetes resources excluded reduce the number of watched events
        - apiGroups:
          - coordination.k8s.io
          kinds:
          - Lease
        ### Internal Kubernetes Authz/Authn resources excluded reduce the number of watched events
        - apiGroups:
          - authentication.k8s.io
          - authorization.k8s.io
          kinds:
          - SelfSubjectReview
          - TokenReview
          - LocalSubjectAccessReview
          - SelfSubjectAccessReview
          - SelfSubjectRulesReview
          - SubjectAccessReview
        ### Intermediate Certificate Request excluded reduce the number of watched events
        - apiGroups:
          - certificates.k8s.io
          kinds:
          - CertificateSigningRequest
        - apiGroups:
          - cert-manager.io
          kinds:
          - CertificateRequest
        ### Cilium internal resources excluded reduce the number of watched events and UI Clutter
        - apiGroups:
          - cilium.io
          kinds:
          - CiliumIdentity
          - CiliumEndpoint
          - CiliumEndpointSlice
        ### Kyverno intermediate and reporting resources excluded reduce the number of watched events and improve performance
        - apiGroups:
          - kyverno.io
          - reports.kyverno.io
          - wgpolicyk8s.io
          kinds:
          - PolicyReport
          - ClusterPolicyReport
          - EphemeralReport
          - ClusterEphemeralReport
          - AdmissionReport
          - ClusterAdmissionReport
          - BackgroundScanReport
          - ClusterBackgroundScanReport
          - UpdateRequest
