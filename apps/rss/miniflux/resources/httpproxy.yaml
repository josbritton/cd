# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/refs/heads/main/projectcontour.io/httpproxy_v1.json
apiVersion: projectcontour.io/v1
kind: HTTPProxy
metadata:
  name: miniflux-ingress
  namespace: rss
  labels:
    app.kubernetes.io/name: miniflux
    app.kubernetes.io/component: reader
    app.kubernetes.io/part-of: rss
  annotations:
    argocd.argoproj.io/sync-wave: "100"  # needs certs, delegation, services, etc.
spec:
  virtualhost:
    fqdn: rss.swifthomelab.net
    tls:
      secretName: cert-manager/rss-swifthomelab-net
  routes:
  - services:
    - name: miniflux
      port: 80
    conditions:
    - prefix: /
    timeoutPolicy:
      response: 60s  # if NULL, uses 15s (envoy default)
