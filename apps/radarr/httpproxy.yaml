# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/refs/heads/main/projectcontour.io/httpproxy_v1.json
apiVersion: projectcontour.io/v1
kind: HTTPProxy
metadata:
  name: radarr-ingress
  namespace: radarr
  annotations:
    argocd.argoproj.io/sync-wave: "100"  # needs certs, delegation, services, etc.
spec:
  virtualhost:
    fqdn: radarr.swifthomelab.net
    tls:
      secretName: cert-manager/radarr-swifthomelab-net
  routes:
  - services:
    - name: radarr
      port: 7878
    timeoutPolicy:
      response: 600s  # if NULL, uses 15s (envoy default)
