# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/refs/heads/main/argoproj.io/application_v1alpha1.json
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: rustfs
  namespace: argocd
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  destination:
    namespace: rustfs
    server: https://kubernetes.default.svc
  project: default
  sources:
  - path: &path apps/rustfs
  #   repoURL: https://github.com/josbritton/cd.git
  # - path: *path
    repoURL: https://git.swifthomelab.net/josbritton/cd.git
  syncPolicy:
    syncOptions:
    - CreateNamespace=true
