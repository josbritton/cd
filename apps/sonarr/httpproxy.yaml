# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/refs/heads/main/projectcontour.io/httpproxy_v1.json
apiVersion: projectcontour.io/v1
kind: HTTPProxy
metadata:
  name: sonarr-ingress
  namespace: sonarr
  annotations:
    argocd.argoproj.io/sync-wave: "100"  # needs certs, delegation, services, etc.
spec:
  virtualhost:
    fqdn: sonarr.swifthomelab.net
    tls:
      secretName: cert-manager/sonarr-swifthomelab-net
  routes:
  - services:
    - &svc-0
      name: sonarr
      port: 8989
    timeoutPolicy:
      response: 600s  # if NULL, uses 15s (envoy default)
  - conditions:
    - prefix: /signalr/messages
    enableWebsockets: true
    services:
    - *svc-0
    timeoutPolicy:
      response: infinity
---
