# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/refs/heads/master/master/service-v1.json
apiVersion: v1
kind: Service
metadata:
  name: cypht
  namespace: cypht
  labels:
    app.kubernetes.io/name: cypht
    app.kubernetes.io/instance: cypht
    app.kubernetes.io/part-of: cypht
spec:
  type: ClusterIP
  publishNotReadyAddresses: false
  ports:
  - name: http
    port: 80
    protocol: TCP
    targetPort: 80
  selector:
    app.kubernetes.io/name: cypht
    app.kubernetes.io/instance: cypht
    app.kubernetes.io/part-of: cypht
