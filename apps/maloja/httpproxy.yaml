# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/refs/heads/main/projectcontour.io/httpproxy_v1.json
apiVersion: projectcontour.io/v1
kind: HTTPProxy
metadata:
  name: maloja-ingress
  namespace: maloja
  labels:
    app.kubernetes.io/name: maloja
    app.kubernetes.io/instance: maloja
    app.kubernetes.io/part-of: maloja
  annotations:
    argocd.argoproj.io/sync-wave: "100"  # needs certs, delegation, services, etc.
spec:
  virtualhost:
    fqdn: fm.swifthomelab.net
    tls:
      secretName: cert-manager/fm-swifthomelab-net
  routes:
  - services:
    - name: maloja
      port: 42010
    conditions:
    - prefix: /
    timeoutPolicy:
      response: 60s  # if NULL, uses 15s (envoy default)
