# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/refs/heads/main/monitoring.coreos.com/prometheusrule_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: provisioned-recording-rules-extra
  namespace: prometheus-operator
  labels:
    release: prometheus-operator
spec:
  groups:
  - name: extra-provisioned.rules
    interval: 10s
    rules:
    - record: namespace:container_cpu_usage_seconds:sum_rate1m
      labels: {}
      expr: |2
          sum by (namespace) (rate(container_cpu_usage_seconds_total{image!=""}[1m]))
        + on (namespace)
          (
            sum by (namespace) (
                  rate(windows_container_cpu_usage_seconds_total{container_id!=""}[1m])
                * on (container_id) group_left (container, pod, namespace)
                  max by (container, container_id, pod, namespace) (
                    kube_pod_container_info{container_id!=""}
                  )
              or
                kube_namespace_created * 0
            )
          )
    - record: namespace:container_memory_working_set_bytes:sum
      expr: |2
          sum by (namespace) (container_memory_working_set_bytes{image!=""})
        + on (namespace)
          (
            sum by (namespace) (
                  windows_container_memory_usage_commit_bytes{container_id!=""}
                * on (container_id) group_left (container, pod, namespace)
                  max by (container, container_id, pod, namespace) (
                    kube_pod_container_info{container_id!=""}
                  )
              or
                kube_namespace_created * 0
            )
          )
    - record: namespace:container_fs_writes_bytes:sum_rate5m
      expr: >-
        sum by (namespace) (
          rate(
            container_fs_writes_bytes_total{container!="",device=~"(/dev/)?(mmcblk.p.+|nvme.+|rbd.+|sd.+|vd.+|xvd.+|dm-.+|md.+|dasd.+)",job="kubelet",metrics_path="/metrics/cadvisor",namespace!=""}[5m]
          )
        )
    - record: namespace:container_fs_reads_bytes:sum_rate5m
      expr: >-
        sum by (namespace) (
          rate(
            container_fs_reads_bytes_total{container!="",device=~"(/dev/)?(mmcblk.p.+|nvme.+|rbd.+|sd.+|vd.+|xvd.+|dm-.+|md.+|dasd.+)",job="kubelet",metrics_path="/metrics/cadvisor",namespace!=""}[5m]
          )
        )
    - record: namespace:container_fs_writes_bytes:sum_rate1m
      expr: >-
        sum by (namespace) (
          rate(
            container_fs_writes_bytes_total{container!="",device=~"(/dev/)?(mmcblk.p.+|nvme.+|rbd.+|sd.+|vd.+|xvd.+|dm-.+|md.+|dasd.+)",job="kubelet",metrics_path="/metrics/cadvisor",namespace!=""}[1m]
          )
        )
    - record: namespace:container_fs_reads_bytes:sum_rate1m
      expr: >-
        sum by (namespace) (
          rate(
            container_fs_reads_bytes_total{container!="",device=~"(/dev/)?(mmcblk.p.+|nvme.+|rbd.+|sd.+|vd.+|xvd.+|dm-.+|md.+|dasd.+)",job="kubelet",metrics_path="/metrics/cadvisor",namespace!=""}[1m]
          )
        )
    - record: namespace:container_fs_writes_bytes:sum_irate1m
      expr: >-
        sum by (namespace) (
          irate(
            container_fs_writes_bytes_total{container!="",device=~"(/dev/)?(mmcblk.p.+|nvme.+|rbd.+|sd.+|vd.+|xvd.+|dm-.+|md.+|dasd.+)",job="kubelet",metrics_path="/metrics/cadvisor",namespace!=""}[1m]
          )
        )
    - record: namespace:container_fs_reads_bytes:sum_irate1m
      expr: >-
        sum by (namespace) (
          irate(
            container_fs_reads_bytes_total{container!="",device=~"(/dev/)?(mmcblk.p.+|nvme.+|rbd.+|sd.+|vd.+|xvd.+|dm-.+|md.+|dasd.+)",job="kubelet",metrics_path="/metrics/cadvisor",namespace!=""}[1m]
          )
        )
    - record: instance:etcd_disk_wal_fsync_duration_seconds:histogram_quantile99_rate5m
      expr: >-
        histogram_quantile(
          0.99,
          sum by (instance, le) (rate(etcd_disk_wal_fsync_duration_seconds_bucket{job=~".*etcd.*"}[5m]))
        )
    - record: instance:etcd_disk_backend_commit_duration_seconds:histogram_quantile99_rate5m
      expr: >-
        histogram_quantile(
          0.99,
          sum by (instance, le) (rate(etcd_disk_backend_commit_duration_seconds_bucket{job=~".*etcd.*"}[5m]))
        )
    - record: dimension_family:netdata_disk_space_bytes:sum
      expr: >-
        sum by (dimension,family) (
            (netdata_disk_space{family="/mnt/artemis/data"} * 16384)
          or
            (netdata_disk_space{family=~"/mnt/artemis(|/home|/pve)"} * 131072)
        )
    - record: dimension:netdata_disk_space_bytes:max
      expr: >-
        max by (dimension) (
          dimension_family:netdata_disk_space_bytes:sum{dimension="avail"}
        )
    - record: instance_job_family:netdata_cpu_cpu:avg_sum_rate30s
      expr: >-
        avg by (instance, job, family) (
          sum by (instance, job, chart, family) (rate(netdata_cpu_cpu_total{dimension!="idle"}[30s]))
        )
    - record: family_dimension:netdata_disk_io:sum_rate20s
      expr: >-
        sum by(family, dimension) (rate(netdata_disk_io_total[20s]))
