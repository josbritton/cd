# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
# yamllint disable rule:comments
name: Validate Manifests
on: # yamllint disable-line rule:truthy
  push: {}
permissions:
  contents: read
defaults:
  run:
    shell: bash  # explicit, so steps also get pipefail
jobs:
  lint:
    name: Lint yaml
    runs-on: ubuntu-latest
    steps:
    - name: Code Checkout
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
    - name: Run yamllint
      uses: ibiqlik/action-yamllint@2576378a8e339169678f9939646ee3ee325e845c # v3.1.1
      with:
        file_or_dir: .
        format: github  # OUTPUT format (github=fancy github output)

  helm:
    name: Render helm chart templates
    runs-on: ubuntu-latest
    steps:
    - name: Code Checkout
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
    - name: Render helm chart templates
      run: |
        find apps/ -regex ".*/upstream/Chart.ya?ml" -print0 \
          | parallel -0 -j0 'helm dependency update {//} && helm template --include-crds --namespace testns -- testchart {//}'

  kustomize:
    name: Build kustomization files
    runs-on: ubuntu-latest
    steps:
    - name: Code Checkout
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
    - name: Build kustomize files
      run: |
        { find apps/ -name kustomization.yaml -print0; printf '%s\0' bootstrap/argo-cd/kustomization.yaml; } \
          | parallel -0 -j0 'kustomize build {//}'

  kubeconform:
    name: Validate kubernetes manifests
    runs-on: ubuntu-latest
    steps:
    - name: Code Checkout
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
    - name: Setup Go environment
      uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
      with:
        go-version: stable
        cache: false  # no deps to cache
    - name: Install kubeconform
      run: |
        go install github.com/yannh/kubeconform/cmd/kubeconform@latest
    - name: Generate cache key
      id: generate-cache-key
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        head_sha() {
          curl -fsS --retry 3 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github.VERSION.sha" \
            "${GITHUB_API_URL}/repos/$1/commits/$2"
        }

        datree_sha="$(head_sha datreeio/CRDs-catalog main)"
        schemastore_sha="$(head_sha schemastore/schemastore master)"

        key="$(printf '%s%s' "$datree_sha" "$schemastore_sha" | md5sum | cut -c 1-7)"
        echo "key=$key" >> "$GITHUB_OUTPUT"
    - name: Restore cached schemas
      id: cache-kubeconform-restore
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        fail-on-cache-miss: false
        path: |
          ${{ github.workspace }}/.cache/kubeconform
        key: kubeconform-schemas-${{ steps.generate-cache-key.outputs.key }}
    - name: Get cached schemas
      if: steps.cache-kubeconform-restore.outputs.cache-hit == 'true'
      run: |
        ls -R "$GITHUB_WORKSPACE/.cache/kubeconform"
    - name: Validate manifests with kubeconform
      run: |
        mkdir -p "$GITHUB_WORKSPACE/.cache/kubeconform"

        kubeconform \
          -n "$(nproc)" \
          --cache "$GITHUB_WORKSPACE/.cache/kubeconform" \
          --skip CustomResourceDefinition \
          --ignore-filename-pattern "apps/.*/upstream/.*\.ya?ml" \
          --ignore-filename-pattern "apps/.*/files/.*\.ya?ml" \
          --ignore-filename-pattern "apps/.*/overlays/.*\.ya?ml" \
          --ignore-filename-pattern "/.*\.json" \
          --schema-location default \
          --schema-location "https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json" \
          --schema-location "https://json.schemastore.org/{{.ResourceKind}}.json" \
          --summary \
          --strict \
          --verbose \
          -- apps/
    - name: Cache schemas
      id: cache-kubeconform-save
      if: steps.cache-kubeconform-restore.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ${{ github.workspace }}/.cache/kubeconform
        key: kubeconform-schemas-${{ steps.generate-cache-key.outputs.key }}
