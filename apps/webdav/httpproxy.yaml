# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/refs/heads/main/projectcontour.io/httpproxy_v1.json
apiVersion: projectcontour.io/v1
kind: HTTPProxy
metadata:
  name: webdav-ingress
  namespace: webdav
  labels:
    app.kubernetes.io/name: webdav
    app.kubernetes.io/instance: webdav
  annotations:
    argocd.argoproj.io/sync-wave: "100"  # needs certs, delegation, services, etc.
spec:
  virtualhost:
    fqdn: webdav.swifthomelab.net
    tls:
      secretName: cert-manager/webdav-swifthomelab-net
  routes:
  # block apache status page
  - conditions:
    - exact: /status
    directResponsePolicy:
      statusCode: 404
  - conditions:
    - prefix: /status/
    directResponsePolicy:
      statusCode: 404
  - services:
    - name: webdav
      port: 80
    timeoutPolicy:
      response: 60s  # if NULL, uses 15s (envoy default)
