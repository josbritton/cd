# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/refs/heads/master/master/service-v1.json
apiVersion: v1
kind: Service
metadata:
  name: miniflux
  namespace: rss
  labels:
    app.kubernetes.io/name: miniflux
    app.kubernetes.io/component: reader
    app.kubernetes.io/part-of: rss
spec:
  type: ClusterIP
  publishNotReadyAddresses: false
  ports:
  - name: http
    port: 80
    protocol: TCP
    targetPort: 8080
  # - name: metrics
  #   ...
  selector:
    app.kubernetes.io/name: miniflux
    app.kubernetes.io/component: reader
    app.kubernetes.io/part-of: rss
